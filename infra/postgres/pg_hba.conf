# TYPE   DATABASE  USER          ADDRESS        METHOD
# Socket local dentro do container (healthcheck, psql via docker exec)
local    all       all                          scram-sha-256
host     all       all           127.0.0.1/32   scram-sha-256

# Superusuário nunca entra pela rede.
hostssl  all       postgres      0.0.0.0/0      reject
hostssl  all       postgres      ::/0           reject

# App (Vercel) e operadores: só com TLS e senha SCRAM.
hostssl  lumiardi  lumiardi_app  0.0.0.0/0      scram-sha-256
hostssl  lumiardi  lumiardi_app  ::/0           scram-sha-256

# Qualquer conexão sem TLS é recusada.
host     all       all           0.0.0.0/0      reject
host     all       all           ::/0           reject
